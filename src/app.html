<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Resolve the theme before first paint so there is no light/dark flash -->
		<script>
			(function () {
				var d = document.documentElement;
				d.classList.add('js');
				try {
					var t = localStorage.getItem('theme');
					if (t !== 'light' && t !== 'dark') {
						t = 'dark';
					}
					d.setAttribute('data-theme', t);
				} catch (e) {}
			})();
		</script>

		<!-- Fonts: Geist (UI), Geist Mono (labels & metrics), Instrument Serif (accents) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
		/>

		<!-- Site-wide meta. Page title, description, Open Graph, Twitter and
		     JSON-LD are generated from portfolio.json in src/routes/+page.svelte. -->
		<meta name="author" content="Ajinkya Taranekar" />
		<meta name="google-site-verification" content="TDynlOLae4AfEw94yQ19d7dYHnyQBXQdN0plCUFcnEY" />
		<meta name="robots" content="index, follow, max-image-preview:large" />
		<meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Icons -->
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-H4R14CS9JE"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());

			gtag('config', 'G-H4R14CS9JE');
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
